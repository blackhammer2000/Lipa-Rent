name: Security Audit

on:
  push:
    branches: ["react"]
  pull_request:
    branches: ["react"]
  schedule:
    - cron: "0 0 * * 0" # Weekly, every Sunday at midnight UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working-directory: [".", "SERVER", "CLIENT/react"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.working-directory }}

      - name: Run npm audit
        run: npm audit
        working-directory: ${{ matrix.working-directory }}
