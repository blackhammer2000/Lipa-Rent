<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../indexResources/css/index.css" />
    <link

    />
    <link

    <script src="./resources/js/classes/dashclasses.js" defer></script>
    <script src="./resources/js/dashboard.js" defer></script>
  </head>
  <body>
    <div class="home container-fluid font-italic">
      <div
        class="header d-flex container-fluid align-items-center mt-2 border-bottom border-success"
      >
        <div
          class="heading d-flex flex-column justify-content-center align-items-center w-50 border-success"
        >
          <div class="logo d-flex justify-content-center w-50">
            <h1 class="font-weight-bolder">
              <span>LiPA<span class="text-success">RENT&reg;</span></span>
            </h1>
            <img
              src="../indexResources/images/black-cat-simple-logo-design-vector.jpg"
              alt="lipa rent logo"
              width="50px"
            />
          </div>

          <!-- <div
            class="action d-flex justify-content-center align-items-center w-50"
          >
            <form
              action=""
              class="w-100 d-flex justify-content-center align-items-center"
            >
              <div class="form-group w-100">
                <input
                  class="form-control text-uppercase"
                  placeholder="Search by Property Number"
                  type="search"
                  name=""
                  id=""
                />
              </div>
            </form>
          </div> -->
        </div>

        <div class="routers mt-2 d-flex w-50 justify-content-center">
          <ul class="list-unstyled d-flex">
            <li class="mr-4">
              <a href="../pages/rooms/rooms.html"
                ><button class="btn btn-outline-success">ROOMS</button></a
              >
            </li>
            <li>
              <a href=""
                ><button class="btn btn-outline-success">TENANTS</button></a
              >
            </li>
            <li class="ml-4">
              <a href=""
                ><button class="btn btn-outline-success">RENTS</button></a
              >
            </li>
          </ul>
        </div>
      </div>

      <div class="mt-3 hero d-flex flex-column container-fluid text-center">
        <div class="d-flex justify-content-between mb-2">
          <div class="text-left w-25">
            <button data-create-property-button class="btn btn-success">
              CREATE PROPERTY
            </button>
          </div>
          <div class="text-center w-75">
            <h2 class="" data-dashboard-description="">
              PROPERTIES OF PETER KARANJA, ID: 377725864
            </h2>
          </div>
        </div>

        <div class="tableCover overflow-auto">
          <table class="table table-active mt-2">
            <thead class="">
              <tr>
                <th>NO.</th>
                <th>PROPERTY ID</th>
                <th>PROPERTY NAME</th>
                <th>PROPERTY NUMBER</th>
                <th>PROPERTY LOCATION</th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody data-table></tbody>
          </table>
        </div>
      </div>

      <footer
        class="footer mt-5 font-weight-bold d-flex container-fluid border-top border-success pt-3"
      >
        <div class="copyrights w-50 text-center">
          <span>LiPA<span class="text-success">RENT&reg;</span></span>
          2024
        </div>

        <div
          class="conditions w-50 d-flex justify-content-center align-items-center"
        >
          <ul
            class="d-flex justify-content-center align-items-center list-unstyled"
          >
            <li class="mr-3">
              <a class="text-dark" href="">About Us</a>
            </li>
            <li class="mr-3">
              <a class="text-dark" href="">Contact</a>
            </li>
            <li class="mr-3">
              <a class="text-dark" href="">Terms & Conditions</a>
            </li>
            <li class="ml-3">
              <a class="text-dark" href="">Privacy Policies</a>
            </li>
            <li class="ml-5">
              <a class="text-dark" href="../login/login.html"
                ><button class="btn btn-outline-danger">LOG OUT</button></a
              >
            </li>
          </ul>
        </div>
      </footer>
    </div>

    <!-- CREATE NEW PROPERTY MODAL -->
    <div
      data-create-property
      class="propertyModal hide container justify-content-center align-items-center"
    >
      <fieldset class="border border-success p-5 border-radius-50">
        <legend class="d-flex justify-content-around text-center">
          <h4>CREATE PROPERTY</h4>
          <span class="closeModal" draggable="true">
            <button data-close-create-modal class="btn btn-danger">X</button>
          </span>
        </legend>

        <form action="" class="form">
          <div class="form-group">
            <input
              data-new-property-name
              placeholder="property name"
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <input
              data-new-property-number
              placeholder="property number"
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <input
              data-new-property-location
              placeholder="property location"
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>

          <div class="form-group text-center">
            <button class="btn btn-success w-100">ADD PROPERTY</button>
          </div>
        </form>
      </fieldset>
    </div>

    <!-- EDIT PROPERTY MODAL -->
    <div
      data-edit-property
      class="propertyModal hide container justify-content-center align-items-center"
    >
      <fieldset class="border border-success p-5 border-radius-50">
        <legend class="d-flex justify-content-around text-center">
          <h4>EDIT PROPERTY</h4>
          <span class="closeModal" draggable="true">
            <button data-close-edit-modal class="btn btn-danger">X</button>
          </span>
        </legend>

        <h5 class="text-center">
          Property Id:
          <span class="font-weight-light" data-edit-property-id></span> -----
          Property Number:
          <span class="font-weight-light" data-edit-property-number></span>
        </h5>

        <form data-edit-property-form action="" class="form">
          <div class="form-group">
            <label class="font-weight-bold">PROPERTY NAME:</label>
            <input
              data-edited-name
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <label class="font-weight-bold">PROPERTY NUMBER:</label>
            <input
              data-edited-number
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <label class="font-weight-bold">PROPERTY LOCATION:</label>
            <input
              data-edited-location
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>

          <div class="form-group text-center">
            <button data-edit-property-button class="btn btn-primary w-100">
              EDIT PROPERTY
            </button>
          </div>
        </form>
      </fieldset>
    </div>
  </body>
</html>
