<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiPARENT | TENANTS</title>

    <link rel="stylesheet" href="../../utils/utils.css" />
    <link
      rel="stylesheet"
      href="../../indexResources/css/font-awesome/font-awesome-4.7.0/font-awesome-4.7.0/css/font-awesome.css"
    />
    <link
      rel="stylesheet"
      href="../../indexResources/css/font-awesome/font-awesome-4.7.0/font-awesome-4.7.0/css/font-awesome.min.css"
    />
    <link
      rel="stylesheet"
      href="../../indexResources/bootstrap/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="../../indexResources/bootstrap/css/bootstrap.min.css.map"
    />
    <link rel="stylesheet" href="./resources/css/tenants.css" />

    <!-- <script src="./resources/js/helpers.js" defer></script> -->

    <script src="../../utils/utils.js" defer></script>
    <script src="./resources/js/classes/tenantsClasses.js" defer></script>
    <script src="./resources/js/tenants.js" defer></script>
  </head>
  <body>
    <div class="home container-fluid font-italic">
      <div
        class="header d-flex container-fluid align-items-center mt-2 border-bottom border-success"
      >
        <div
          class="heading d-flex flex-column justify-content-center align-items-center w-50 border-success"
        >
          <div class="logo d-flex justify-content-center w-50">
            <h1 class="font-weight-bolder">
              <span>LiPA<span class="text-success">RENT&reg;</span></span>
            </h1>
            <img
              src="../../indexResources/images/black-cat-simple-logo-design-vector.jpg"
              alt="lipa rent logo"
              width="50px"
            />
          </div>

          <div
            class="action d-flex justify-content-center align-items-center w-50"
          >
            <form
              data-select-room-form
              action=""
              class="mr-2 w-100 d-flex justify-content-center align-items-center"
            >
              <div class="form-group d-flex w-100">
                <select
                  class="form-control border border-right-0 border-left border-top-0 border-bottom"
                ></select>
                <button
                  type="submit"
                  class="btn border border-right border-left-0 border-top-0 border-bottom text-success"
                >
                  <i class="fa fa-search"></i>
                </button>
              </div>
            </form>
          </div>
        </div>

        <div class="routers mt-4 d-flex w-50 justify-content-center">
          <ul class="list-unstyled d-flex">
            <li class="mr-4">
              <a href="../../dashboard/dashboard.html"
                ><button class="btn btn-outline-success">DASH</button></a
              >
            </li>
            <li>
              <a href="../rooms/rooms.html"
                ><button class="btn btn-outline-success">ROOMS</button></a
              >
            </li>
            <li class="ml-4">
              <a href=""
                ><button class="btn btn-outline-success">RENTS</button></a
              >
            </li>
          </ul>
        </div>
      </div>

      <div class="hero mt-5 d-flex flex-column container-fluid text-center">
        <div class="d-flex justify-content-between mb-2">
          <div class="text-left w-25">
            <button data-create-tenant-button class="btn btn-success">
              ADD TENANT
            </button>
          </div>
          <div class="text-center w-75">
            <h2 class="" data-table-description></h2>
          </div>
        </div>
        <div class="overflow-auto pt-0">
          <table class="table table-active bg-white mt-2">
            <thead class="position-sticky bg-white">
              <tr>
                <th>NO.</th>
                <th>TENANT ID</th>
                <th>TENANT NAME</th>
                <th>TENANT NATIONAL ID</th>
                <th>TENANT PHONE</th>
                <th>TENANT MOVE IN</th>
                <th>TENANT MOVE OUT</th>
                <th>TENANT ACTIONS</th>
              </tr>
            </thead>
            <tbody data-table></tbody>
          </table>
        </div>
      </div>

      <footer
        class="footer mt-5 font-weight-bold d-flex container-fluid border-top border-success pt-3"
      >
        <div class="copyrights w-50 text-center">
          <span>LiPA<span class="text-success">RENT&reg;</span></span>
          2024
        </div>

        <div
          class="conditions w-50 d-flex justify-content-center align-items-center"
        >
          <ul
            class="d-flex justify-content-center align-items-center list-unstyled"
          >
            <li class="mr-3">
              <a class="text-dark" href="">About Us</a>
            </li>
            <li class="mr-3">
              <a class="text-dark" href="">Contact</a>
            </li>
            <li class="mr-3">
              <a class="text-dark" href="">Terms & Conditions</a>
            </li>
            <li class="ml-3">
              <a class="text-dark" href="">Privacy Policies</a>
            </li>
            <li class="ml-5">
              <button data-logout class="btn btn-outline-danger">
                LOG OUT
              </button>
            </li>
          </ul>
        </div>
      </footer>
    </div>

    <!-- CREATE NEW TENANT MODAL -->
    <div
      data-create-tenant
      class="tenantModal hide container justify-content-center align-items-center"
    >
      <fieldset class="border border-success p-5 border-radius-50">
        <legend class="d-flex justify-content-around text-center">
          <h4>ADD TENANT TO ROOM</h4>
          <span class="closeModal" draggable="true">
            <button data-close-create-tenant-modal class="btn btn-danger">
              X
            </button>
          </span>
        </legend>

        <form data-new-tenant-form action="" class="form">
          <div class="form-group">
            <input
              data-new-tenant-name
              placeholder="TENANT NAME"
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <input
              data-new-tenant-nationalID
              placeholder="NATIONAL ID"
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <input
              data-new-tenant-phone
              placeholder="TENANT PHONE"
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>

          <div class="form-group text-center">
            <button class="btn btn-success w-100">ADD TENANT</button>
          </div>
        </form>
      </fieldset>
    </div>

    <!-- EDIT PROPERTY MODAL -->
    <div
      data-edit-tenant
      class="tenantModal hide container justify-content-center align-items-center"
    >
      <fieldset class="border border-success p-5 border-radius-50">
        <legend class="d-flex justify-content-around text-center">
          <h4>EDIT ROOM</h4>
          <span class="closeModal" draggable="true">
            <button data-close-edit-modal class="btn btn-danger">X</button>
          </span>
        </legend>

        <h5 class="text-center">
          Tenant Id:
          <span class="font-weight-light" data-edit-tenant-id></span>
        </h5>

        <form data-edit-tenant-form action="" class="form">
          <div class="form-group">
            <label class="font-weight-bold">TENANT NAME:</label>
            <input
              data-edited-name
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <label class="font-weight-bold">NATIONAL ID</label>
            <input
              data-edited-nationalID
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <label class="font-weight-bold">TENANT PHONE:</label>
            <input
              data-edited-phone
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <label class="font-weight-bold">TENANT MOVE OUT DATE:</label>
            <input
              data-edited-moveout
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>

          <div class="form-group text-center">
            <button data-edit-tenant-button class="btn btn-primary w-100">
              EDIT TENANT
            </button>
          </div>
        </form>
      </fieldset>
    </div>

    <!-- LOADER -->
    <div
      data-loader
      class="loader text-white bg-secondary hide justify-content-between align-items-center p-2 font-weight-bold"
    >
      <div data-loaderText class="loaderText"></div>
      <div data-loaderSpinner class="loaderSpinner ml-3"></div>
    </div>
  </body>
</html>
