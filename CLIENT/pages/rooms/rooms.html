<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiPARENT | ROOMS</title>

    <link rel="stylesheet" href="../../indexResources/css/index.css" />
    <link
      rel="stylesheet"
      href="../../indexResources/css/font-awesome/font-awesome-4.7.0/font-awesome-4.7.0/css/font-awesome.css"
    />
    <link
      rel="stylesheet"
      href="../../indexResources/css/font-awesome/font-awesome-4.7.0/font-awesome-4.7.0/css/font-awesome.min.css"
    />
    <link
      rel="stylesheet"
      href="../../indexResources/bootstrap/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="../../indexResources/bootstrap/css/bootstrap.min.css.map"
    />
    <link rel="stylesheet" href="./resources/css/rooms.css" />

    <script src="./resources/js/helpers/helpers.js" defer></script>
    <script src="./resources/js/classes/roomsclasses.js" defer></script>
    <script src="./resources/js/rooms.js" defer></script>
  </head>
  <body>
    <div class="home container-fluid font-italic">
      <div
        class="header d-flex flex-column container-fluid align-items-center mt-2 border-bottom border-success"
      >
        <div class="heading d-flex justify-content-between container-fluid">
          <div class="logo d-flex justify-content-center w-50">
            <h1 class="font-weight-bolder">
              <span>LiPA<span class="text-success">RENT&reg;</span></span>
            </h1>
            <img
              src="../indexResources/images/black-cat-simple-logo-design-vector.jpg"
              alt="lipa rent logo"
              width="50px"
            />
          </div>

          <div
            class="action d-flex justify-content-center align-items-center w-50"
          >
            <form
              action=""
              class="w-75 d-flex justify-content-center align-items-center"
            >
              <div class="form-group w-100">
                <input
                  class="form-control text-uppercase"
                  placeholder="Search by Property Number"
                  type="search"
                  name=""
                  id=""
                />
              </div>
            </form>
          </div>
        </div>

        <div class="routers">
          <ul class="list-unstyled d-flex">
            <li>
              <a href="../../dashboard/dashboard.html"
                ><button class="btn btn-outline-secondary">DASH</button></a
              >
            </li>
            <li>
              <a href=""
                ><button class="btn btn-outline-secondary">TENANTS</button></a
              >
            </li>
            <li>
              <a href=""
                ><button class="btn btn-outline-secondary">RENTS</button></a
              >
            </li>
          </ul>
        </div>
      </div>

      <div class="hero mt-5 d-flex flex-column container-fluid text-center">
        <div class="d-flex justify-content-between mb-2">
          <div class="text-left w-25">
            <button data-create-room-button class="btn btn-success">
              CREATE ROOM
            </button>
          </div>
          <div class="text-center w-75">
            <h2 class="" data-dashboard-description>
              PROPERTIES OF PETER KARANJA, ID: 377725864
            </h2>
          </div>
        </div>

        <table class="table table-active mt-2">
          <thead class="">
            <tr>
              <th>NO.</th>
              <th>ROOM ID</th>
              <th>ROOM NUMBER</th>
              <th>ROOM TYPE</th>
              <th>VACANCY</th>
            </tr>
          </thead>
          <tbody data-table></tbody>
        </table>
      </div>

      <footer
        class="footer mt-5 font-weight-bold d-flex container-fluid border-top border-success pt-3"
      >
        <div class="copyrights w-50 text-center">
          <span>LiPA<span class="text-success">RENT&reg;</span></span>
          2024
        </div>

        <div
          class="conditions w-50 d-flex justify-content-center align-items-center"
        >
          <ul
            class="d-flex justify-content-center align-items-center list-unstyled"
          >
            <li class="mr-3">
              <a class="text-dark" href="">About Us</a>
            </li>
            <li class="mr-3">
              <a class="text-dark" href="">Contact</a>
            </li>
            <li class="mr-3">
              <a class="text-dark" href="">Terms & Conditions</a>
            </li>
            <li class="ml-3">
              <a class="text-dark" href="">Privacy Policies</a>
            </li>
            <li class="ml-5">
              <a class="text-dark" href="../login/login.html"
                ><button class="btn btn-outline-danger">LOG OUT</button></a
              >
            </li>
          </ul>
        </div>
      </footer>
    </div>

    <!-- CREATE NEW PROPERTY MODAL -->
    <div
      data-create-room
      class="roomModal hide container justify-content-center align-items-center"
    >
      <fieldset class="border border-success p-5 border-radius-50">
        <legend class="d-flex justify-content-around text-center">
          <h4>CREATE ROOM</h4>
          <span class="closeModal" draggable="true">
            <button data-close-create-modal class="btn btn-danger">X</button>
          </span>
        </legend>

        <form action="" class="form">
          <div class="form-group">
            <input
              data-new-room-number
              placeholder="ROOM NUMBER"
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <input
              data-new-room-rate
              placeholder="ROOM RATE PER MONTH"
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <input
              data-new-room-type
              placeholder="ROOM TYPE"
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>

          <div class="form-group text-center">
            <button class="btn btn-success w-100">ADD ROOM</button>
          </div>
        </form>
      </fieldset>
    </div>

    <!-- EDIT PROPERTY MODAL -->
    <div
      data-edit-room
      class="roomModal hide container justify-content-center align-items-center"
    >
      <fieldset class="border border-success p-5 border-radius-50">
        <legend class="d-flex justify-content-around text-center">
          <h4>EDIT ROOM</h4>
          <span class="closeModal" draggable="true">
            <button data-close-edit-modal class="btn btn-danger">X</button>
          </span>
        </legend>

        <h5 class="text-center">
          Room Id:
          <span class="font-weight-light" data-edit-room-id></span> ----- Room
          Number:
          <span class="font-weight-light" data-edit-room-number></span>
        </h5>

        <form data-edit-property-form action="" class="form">
          <div class="form-group">
            <label class="font-weight-bold">ROOM NUMBER:</label>
            <input
              data-edited-number
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <label class="font-weight-bold">ROOM RATE:</label>
            <input
              data-edited-rate
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <label class="font-weight-bold">ROOM TYPE:</label>
            <input
              data-edited-type
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>

          <div class="form-group text-center">
            <button data-edit-room-button class="btn btn-primary w-100">
              EDIT ROOM
            </button>
          </div>
        </form>
      </fieldset>
    </div>
  </body>
</html>
