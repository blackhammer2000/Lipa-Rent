<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiPARENT | ACCOUNT</title>

    <link rel="stylesheet" href="../../utils/utils.css" />
    <link
      rel="stylesheet"
      href="../../indexResources/css/font-awesome/font-awesome-4.7.0/font-awesome-4.7.0/css/font-awesome.css"
    />
    <link
      rel="stylesheet"
      href="../../indexResources/css/font-awesome/font-awesome-4.7.0/font-awesome-4.7.0/css/font-awesome.min.css"
    />
    <link
      rel="stylesheet"
      href="../../indexResources/bootstrap/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="../../indexResources/bootstrap/css/bootstrap.min.css.map"
    />
    <link rel="stylesheet" href="./resources/css/profile.css" />

    <!-- <script src="./resources/js/helpers.js" defer></script> -->

    <script src="../../utils/utils.js" defer></script>
    <script src="./resources/js/classes/profileClasses.js" defer></script>
    <script src="./resources/js/profile.js" defer></script>
  </head>
  <body>
    <div class="home container-fluid font-italic">
      <header
        class="header d-flex container-fluid align-items-center mt-2 border-bottom border-success"
      >
        <div
          class="heading d-flex justify-content-start align-items-center w-50 border-success"
        >
          <div class="profile position-relative">
            <i class="fa fa-user-circle font-weight-bold text-dark"></i>
          </div>
          <div class="d-flex flex-column container ml-5">
            <div
              class="logo d-flex justify-content-center align-items-center w-50"
            >
              <h1 class="font-weight-bolder">
                <span>LiPA<span class="text-success">RENT</span></span>
              </h1>
              <i class="fa fa-home"></i>
            </div>
          </div>
        </div>

        <div class="routers mt-4 d-flex w-50 justify-content-center">
          <ul class="list-unstyled d-flex">
            <li class="mr-4">
              <a href="../../dashboard/dashboard.html"
                ><button class="btn btn-outline-success">DASH</button></a
              >
            </li>
            <li>
              <a href="../rooms/rooms.html"
                ><button class="btn btn-outline-success">ROOMS</button></a
              >
            </li>
            <li class="ml-4">
              <a href="../tenants/tenants.html"
                ><button data-nav-tenants class="btn btn-outline-success">
                  TENANTS
                </button></a
              >
            </li>
            <li class="ml-4">
              <a href="../rents/rents.html"
                ><button
                  data-nav-rents=""
                  disabled="true"
                  class="btn btn-outline-success"
                >
                  RENTS
                </button></a
              >
            </li>
          </ul>
        </div>
      </header>

      <div class="hero mt-5 d-flex flex-column container-fluid text-center">
        <div class="first d-flex justify-content-between mb-2">
          <div class="text-center container">
            <u><h2 class="" data-table-description>ACCOUNT SETTINGS</h2></u>
          </div>
        </div>
        <div class="container border border-dark mt-4 py-4">
          <div class="container d-flex flex-column align-items-start">
            <h4>Profile Details</h4>
            <ul class="d-flex flex-column list-unstyled text-left">
              <li data-edit-account class="mb-3">
                <i class="fa fa-user mr-2"></i>Change profile details
              </li>
              <li data-edit-password>
                <i class="fa fa-key mr-2"></i>Change password
              </li>
            </ul>
          </div>
          <div
            class="container d-flex flex-column align-items-start mt-3 border-0 border-top border-dark"
          >
            <h4>Reset Account</h4>
            <ul class="d-flex flex-column list-unstyled text-left">
              <li data-delete-account>
                <i class="fa fa-trash mr-2"></i>Delete Account
              </li>
            </ul>
          </div>
        </div>
      </div>

      <footer
        class="footer mt-5 font-weight-bold d-flex container-fluid border-top border-success pt-3"
      >
        <div class="copyrights w-50 pl-5">
          <span>LiPA<span class="text-success">RENT&reg;</span></span>
          2024
        </div>

        <div
          class="conditions w-50 d-flex justify-content-center align-items-center"
        >
          <ul
            class="d-flex justify-content-center align-items-center list-unstyled"
          >
            <li class="mr-3">
              <a class="text-dark" href="">About Us</a>
            </li>
            <li class="mr-3">
              <a class="text-dark" href="">Contact</a>
            </li>
            <li class="mr-3">
              <a class="text-dark" href="">Terms & Conditions</a>
            </li>
            <li class="ml-3">
              <a class="text-dark" href="">Privacy Policies</a>
            </li>
            <li class="ml-5">
              <button data-logout class="btn btn-outline-danger">
                LOG OUT
              </button>
            </li>
          </ul>
        </div>
      </footer>
    </div>

    <!-- EDIT ACCOUNT MODAL -->
    <div
      data-edit-account-modal
      class="accountModal hide container justify-content-center align-items-center"
    >
      <fieldset class="border border-success p-5 border-radius-50">
        <legend class="d-flex justify-content-around text-center">
          <h4>EDIT PROFILE DETAILS</h4>
          <span class="closeModal" draggable="true">
            <button data-close-edit-modal class="btn btn-danger">X</button>
          </span>
        </legend>

        <form data-edit-account-form action="" class="form">
          <div class="form-group">
            <label class="font-weight-bold">NAME:</label>
            <input
              data-edited-name
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <label class="font-weight-bold">NATIONAL ID</label>
            <input
              data-edited-nationalID
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>
          <div class="form-group">
            <label class="font-weight-bold">EMAIL:</label>
            <input
              data-edited-email
              type="text"
              class="form-control"
              required
            />
          </div>
          <div class="form-group">
            <label class="font-weight-bold">PHONE:</label>
            <input
              data-edited-phone
              type="text"
              class="form-control text-uppercase"
              required
            />
          </div>

          <div class="form-group text-center">
            <button data-edit-account-button class="btn btn-primary w-100">
              EDIT ACCOUNT
            </button>
          </div>
        </form>
      </fieldset>
    </div>
  </body>
</html>
