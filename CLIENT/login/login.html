<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiPARENT LOGIN</title>
    <link
      rel="stylesheet"
      href="../indexResources/css/font-awesome/font-awesome-4.7.0/font-awesome-4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="../utils/utils.css" />
    <link
      rel="stylesheet"
      href="../indexResources/bootstrap/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="../indexResources/bootstrap/css/bootstrap.min.css.map"
    />
    <link rel="stylesheet" href="./resources/css/login.css" />
    <script src="../utils/utils.js" defer></script>
    <script src="./resources/js/login.js" defer></script>
  </head>
  <body>
    <div class="home container-fluid font-italic">
      <div
        class="header d-flex container-fluid justify-content-around align-items-center mt-2 border-bottom border-success"
      >
        <div class="logo d-flex justify-content-center align-items-center w-50">
          <h1 class="font-weight-bolder">
            <span>LiPA<span class="text-success">RENT</span></span>
          </h1>
          <i class="fa fa-home"></i>
        </div>

        <div
          class="action d-flex justify-content-center align-items-center w-50"
        >
          <ul class="d-flex list-unstyled">
            <li>
              <a href="../../index.html">
                <button class="btn btn-outline-success ml-2">SIGN UP</button></a
              >
            </li>
          </ul>
        </div>
      </div>

      <div class="hero ctaform">
        <fieldset class="first border border-success p-5 border-radius-50">
          <legend class="font-weight-bold text-center">LOGIN</legend>
          <form action="" class="form">
            <div class="form-group">
              <input
                data-email
                placeholder="Email"
                type="email"
                class="form-control"
                required
              />
            </div>
            <div class="form-group">
              <input
                data-national-id
                placeholder="National ID"
                type="text"
                class="form-control"
                required
              />
            </div>
            <div class="form-group">
              <input
                data-password
                placeholder="Password"
                type="password"
                class="form-control"
                required
              />
            </div>

            <div class="form-group text-center">
              <button class="btn btn-success w-100">LOG IN</button>
            </div>
          </form>
        </fieldset>
      </div>

      <footer
        class="footer mt-5 font-weight-bold text-center d-flex container-fluid border-top border-success py-3"
      >
        <div class="copyrights w-50 text-center">
          <span>LiPA<span class="text-success">RENT&reg;</span></span>
          2024
        </div>
        <div
          class="conditions w-50 d-flex justify-content-center align-items-center"
        >
          <ul class="d-flex list-unstyled">
            <li class="mr-3">
              <a class="text-dark" href="">Terms & Conditions</a>
            </li>
            <li class="ml-3">
              <a class="text-dark" href="">Privacy Policies</a>
            </li>
          </ul>
        </div>
      </footer>
    </div>

    <!-- LOADER -->
    <div
      data-loader
      class="loader text-white bg-secondary hide justify-content-between align-items-center p-2 font-weight-bold"
    >
      <div data-loaderText class="loaderText"></div>
      <div data-loaderSpinner class="loaderSpinner ml-3"></div>
    </div>
  </body>
</html>
