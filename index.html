<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIPA RENT</title>
    <link rel="stylesheet" href="./CLIENT/indexResources/css/index.css" />
    <link
      rel="stylesheet"
      href="./CLIENT/indexResources/bootstrap/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="./CLIENT/indexResources/bootstrap/css/bootstrap.min.css.map"
    />
  </head>
  <body>
    <div class="home container-fluid font-italic">
      <div
        class="header d-flex container-fluid justify-content-around align-items-center mt-2"
      >
        <div class="logo d-flex">
          <h1 class="font-weight-bolder">
            <span>LiPA<span class="text-success">RENT&reg;</span></span>
          </h1>
          <img
            src="./CLIENT/indexResources/images/black-cat-simple-logo-design-vector.jpg"
            alt="lipa rent logo"
            width="50px"
          />
        </div>

        <div class="action">
          <ul class="d-flex list-unstyled">
            <li>
              <a href="./CLIENT/login/login.html">
                <button class="btn btn-outline-success ml-2">LOG IN</button></a
              >
            </li>
          </ul>
        </div>
      </div>

      <div class="hero mt-5 d-flex container-fluid">
        <div
          class="heroText w-50 d-flex justify-content-center align-items-center"
        >
          <h2>
            RENTAL PROPERTY MANAGEMENT <br />
            MADE EASY WITH <br />
            <span>LiPA<span class="text-success">RENT&reg;</span></span>
          </h2>
        </div>
        <div
          class="ctaform w-50 d-flex justify-content-center align-items-center border-left border-success"
        >
          <fieldset class="border border-success p-5 border-radius-50">
            <legend class="font-weight-bold text-center">GET STARTED</legend>
            <form action="" class="form">
              <div class="form-group">
                <input placeholder="Name" type="text" class="form-control" />
              </div>
              <div class="form-group">
                <input
                  placeholder="ID Number"
                  type="number"
                  class="form-control"
                />
              </div>
              <div class="form-group">
                <input placeholder="Email" type="email" class="form-control" />
              </div>
              <div class="form-group">
                <input placeholder="Phone" type="number" class="form-control" />
              </div>
              <div class="form-group">
                <input
                  placeholder="Password"
                  type="password"
                  class="form-control"
                />
              </div>
              <div class="form-group">
                <input
                  placeholder="Confirm Password"
                  type="password"
                  class="form-control"
                />
              </div>
              <div class="form-group text-center">
                <button class="btn btn-success w-100">SIGN UP</button>
              </div>
            </form>
          </fieldset>
        </div>
      </div>
      <footer class="footer mt-5 font-weight-bold d-flex container-fluid">
        <div class="copyrights w-50 text-center">
          <span>LiPA<span class="text-success">RENT&reg;</span></span>
          2024
        </div>

        <div
          class="conditions w-50 d-flex justify-content-center align-items-center"
        >
          <ul class="d-flex list-unstyled">
            <li class="mr-3">
              <a class="text-dark" href="">Terms & Conditions</a>
            </li>
            <li class="ml-3">
              <a class="text-dark" href="">Privacy Policies</a>
            </li>
          </ul>
        </div>
      </footer>
    </div>
  </body>
</html>
